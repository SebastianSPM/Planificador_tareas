<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inicio</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar navbar">
        <div class="container">
            <img src="" alt="">
        </div>
    </nav>
    <main class="container mt-4">
        <div class="row align-items-center mb-10">
            <div class="col-md-7">
                <h2>Planificador de tareas</h2>
                <p class="mb-1"><strong>N° Tareas:</strong> 4</p>
                <p class="mb-0"><strong>Tareas pendientes:</strong> 4</p>
            </div>
            <div class="col-md-4 text-md-end mt-3 mt-md-0">
                <a href="#" class="btn btn-success">Crear</a>
            </div>
        </div>
        <hr>
        <div class="input-group mb-4">
            <input type="text" class="form-control" placeholder="Busca la tarea">
            <button class="btn btn-primary">Buscar</button>
        </div>
        <h4 class="mb-3">Lista de tareas</h4>
        <div class="card mb-3">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="card-title mb-1">Título</h5>
                        <p class="card-text mb-0">Descripción</p>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary">Ver</button>
                        <a href="#" class="btn btn-warning">Editar</a>
                        <button class="btn btn-danger">Finalizar</button>
                    </div>
                </div>
            </div>
        </div>
        <div class="card mb-3">
            <div class="card-body">
                <div class="d-flex justify-content-between align-items-center">
                    <div>
                        <h5 class="card-title mb-1">Título</h5>
                        <p class="card-text mb-0">Descripción</p>
                    </div>
                    <div class="d-flex gap-2">
                        <button class="btn btn-primary">Ver</button>
                        <a href="#" class="btn btn-warning">Editar</a>
                        <button class="btn btn-danger">Finalizar</button>
                    </div>
                </div>
            </div>
        </div>
        <nav aria-label="Paginación de tareas" class="mt-4">
            <ul class="pagination justify-content-center">
                <li class="page-item disabled">
                    <a class="page-link" href="#">Anterior</a>
                </li>
                <li class="page-item active">
                    <a class="page-link" href="#">1</a>
                </li>
                <li class="page-item">
                    <a class="page-link" href="#">2</a>
                </li>
                <li class="page-item">
                    <a class="page-link" href="#">Siguiente</a>
                </li>
            </ul>
        </nav>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>

</body>
</html>
