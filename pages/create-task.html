<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear tarea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="container mt-5">
        <h2 class="text-center mb-5">Crear tarea</h2>
        <form>
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-4">
                        <label for="titulo" class="form-label">Título</label>
                        <input type="text" class="form-control" id="titulo" placeholder="Ingrese el título">
                    </div>
                    <div class="mb-4">
                        <label for="descripcion" class="form-label">Descripción</label>
                        <textarea class="form-control" id="descripcion" rows="4" placeholder="Ingrese la descripción"></textarea>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-4">
                        <label class="form-label">Prioridad</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="prioridad" id="alto" value="Alto">
                            <label class="form-check-label" for="alto">
                                Alto
                            </label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="prioridad" id="medio" value="Medio" checked>
                            <label class="form-check-label" for="medio">Medio</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="prioridad" id="bajo"value="Bajo">
                            <label class="form-check-label" for="bajo">Bajo</label>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="fechaLimite" class="form-label">Fecha límite</label>
                        <input type="date" class="form-control"id="fechaLimite">
                    </div>
                </div>
            </div>
            <div class="text-end">
                <a href="#" class="btn btn-secondary">Cancelar</a>
                <button type="button" class="btn btn-success">Crear</button>
            </div>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/js/app.js"></script>

</body>
</html>
