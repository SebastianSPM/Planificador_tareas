<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear tarea</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    <main class="container mt-5">
        <h1 class="text-center mb-5">Crear tarea</h1>
        <form id="validFormFieldInput">
            <div class="row">
                <div class="col-md-6">
                    <div class="mb-4">
                        <label for="crearTarea" class="form-label">Título</label>
                        <input type="text" class="form-control" id="crearTarea" placeholder="Ingrese el título" minlength="4" maxlength="20">
                    </div>
                    <div class="mb-4">
                        <label for="crearDescripcion" class="form-label">Descripción</label>
                        <textarea class="form-control" id="crearDescripcion" rows="4" placeholder="Escribe una descripción" placeholder="Ingresa una descripción..." minlength="10"></textarea>
                    </div>
                </div>
                <div class="col-md-6">
                    <div class="mb-4">
                        <label class="form-label">Prioridad</label>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="prioridad" id="alto" value="Alto">
                            <label class="form-check-label" for="alto">Alto</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="prioridad" id="medio" value="Medio">
                            <label class="form-check-label" for="medio">Medio</label>
                        </div>
                        <div class="form-check">
                            <input class="form-check-input" type="radio" name="prioridad" id="bajo"value="Bajo">
                            <label class="form-check-label" for="bajo">Bajo</label>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label for="fechaLimite" class="form-label">Fecha límite</label>
                        <input type="datetime-local" class="form-control"id="fechaLimite">
                    </div>
                </div>
            </div>
            <div class="text-end">
                <a id="cancelar" href="../index.html" class="btn btn-secondary px-3 pb-2 pt-2">Cancelar</a>
                <button type="submit" class="btn btn-success px-4 pb-2 pt-2 ms-3">Crear</button>
            </div>
        </form>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="./../js/app.js"></script>

</body>
</html>
